name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project
        id: loc
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f project.zip ]; then
            unzip -q -o project.zip -d _src
            echo "dir=_src/devicecheck-app" >> "$GITHUB_OUTPUT"
          else
            echo "No settings.gradle.kts or project.zip found in the repo root"
            exit 1
          fi

      - name: Add public stalkerware indicators (best effort)
        run: |
          D="${{ steps.loc.outputs.dir }}/app/src/main/assets"
          mkdir -p "$D"
          curl -fsSL https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/ioc.yaml -o /tmp/ioc.yaml || true
          if [ -s /tmp/ioc.yaml ]; then
            grep -oE '[a-z][a-z0-9_]*(\.[A-Za-z0-9_]+){2,}' /tmp/ioc.yaml | sort -u >> "$D/iocs.txt" || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Publish release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" DeviceCheck.apk
          gh release create "v${{ github.run_number }}" DeviceCheck.apk \
            --repo "${{ github.repository }}" \
            --title "DeviceCheck build ${{ github.run_number }}" \
            --notes "Install DeviceCheck.apk on Android 8 or newer."
